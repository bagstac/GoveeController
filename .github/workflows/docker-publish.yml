name: Build and publish container image

# Builds the Docker image and pushes it to GitHub Container Registry whenever main changes.
# Runs the test suite first as a gate — a failing build never gets pushed.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows a manual run from the Actions tab, e.g. to rebuild without a code change

# Least-privilege default for every job in this workflow; build-and-push narrows further by adding
# packages: write only where it's actually needed to push the image.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/govee-controller

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm/v7 covers Raspberry Pi (including older 32-bit-only models like the Pi 2).
          # The Dockerfile cross-publishes for the target arch rather than emulating the whole .NET
          # SDK under QEMU, so this stays fast and avoids the SDK-under-emulation build failures
          # that a full-emulation approach hit during manual testing.
          platforms: linux/amd64,linux/arm/v7
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  cleanup-old-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Every push creates ~5 package versions (a tagged multi-arch manifest list plus its
      # untagged per-platform/attestation children), so these accumulate fast. This action
      # understands manifest-list relationships, so it won't delete an untagged child that a
      # kept tagged version still points to (unlike naively deleting all untagged versions).
      #
      # Requires a classic PAT with read:packages + delete:packages scopes stored as the
      # GHCR_CLEANUP_TOKEN repo secret - GITHUB_TOKEN cannot delete package versions, GitHub
      # only exposes that via a PAT. See README's "Continuous deployment" section.
      - name: Delete old/untagged image versions
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-names: govee-controller
          image-tags: "!latest"
          cut-off: 1d
          keep-n-most-recent: 15
