services:
  govee-controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: govee-controller:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Container timezone (IANA name, e.g. America/Chicago) so "local time" inside the
      # container means the user's wall clock, not UTC. Set TZ in .env; defaults to UTC when
      # unset. The base image ships tzdata, so no Dockerfile change is needed for this to work.
      - TZ=${TZ:-UTC}
    volumes:
      # Bind-mounted to a host directory (not a Docker-managed named volume) so the SQLite
      # database is a real, directly accessible file on the host filesystem — easy to back up,
      # inspect, or move without going through Docker at all. See README's "Configuration
      # reference" for the host-side directory permissions this requires.
      - ./data:/data
    restart: unless-stopped
    # The Dockerfile already declares a HEALTHCHECK (hitting /health); Compose picks that up
    # automatically. `restart: unless-stopped` only recovers from a crash on its own — combined
    # with the healthcheck, Docker also restarts a container that's still running but unresponsive.
    logging:
      # Docker's json-file driver has no size cap unless configured — without this, container
      # logs grow forever and can quietly fill the disk (a real risk on a Pi's SD card). Caps
      # total retention at 3 * 10MB = 30MB, auto-rotated by Docker itself; no cron job or manual
      # cleanup needed. `docker logs` still works normally against the rotated files.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Conservative cap with the smallest realistic deployment target in mind — a Raspberry
          # Pi 2 has only 1GB of RAM total for the whole system, not just this container.
          memory: 512M
